<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Quiz de Noël</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script src="questions.js"></script>
<style>
  :root { --bg:#0f1d2e; --card:#18304a; --txt:#f5f1e8; --muted:#9fb3c8; --gold:#f2c14e;
          --c0:#e63946; --c1:#1d6fd6; --c2:#e9a800; --c3:#2a9d55; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; }
  body { background:radial-gradient(ellipse at top,#1b3556 0%,var(--bg) 70%); color:var(--txt);
         font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; overflow-x:hidden; }
  #app { min-height:100%; display:flex; flex-direction:column; padding:3vh 4vw; gap:3vh; }
  h1 { font-size:clamp(28px,5vw,64px); text-align:center; }
  .muted { color:var(--muted); }
  .center { text-align:center; }
  .grow { flex:1; display:flex; flex-direction:column; justify-content:center; gap:3vh; }
  .btn { background:var(--gold); color:#1a1a1a; border:0; border-radius:14px; font-weight:700;
         font-size:clamp(18px,2.2vw,28px); padding:16px 36px; cursor:pointer; align-self:center; }
  .btn:disabled { opacity:.4; cursor:default; }
  .hint { font-size:14px; color:var(--muted); text-align:center; }

  /* Lobby */
  .lobby { display:flex; gap:5vw; align-items:center; justify-content:center; flex-wrap:wrap; }
  .qr { background:#fff; padding:16px; border-radius:16px; }
  .qr svg { display:block; width:min(36vh,340px); height:auto; }
  .chips { display:flex; flex-wrap:wrap; gap:10px; max-width:40vw; }
  .chip { background:var(--card); padding:10px 18px; border-radius:999px; font-size:clamp(16px,1.8vw,24px); }
  .url { font-size:13px; color:var(--muted); word-break:break-all; max-width:360px; }

  /* Question (TV) */
  .top { display:flex; justify-content:space-between; align-items:center; font-size:clamp(16px,2vw,26px); }
  .timer { width:clamp(60px,8vw,110px); height:clamp(60px,8vw,110px); border-radius:50%;
           background:var(--card); display:flex; align-items:center; justify-content:center;
           font-size:clamp(24px,3.5vw,48px); font-weight:800; border:4px solid var(--gold); }
  .qtext { font-size:clamp(26px,4vw,56px); font-weight:700; text-align:center; line-height:1.2; }
  .opts { display:grid; grid-template-columns:1fr 1fr; gap:2vh 2vw; }
  .opt { border-radius:16px; padding:3vh 2vw; font-size:clamp(20px,2.8vw,40px); font-weight:700;
         display:flex; align-items:center; gap:16px; transition:opacity .3s, transform .3s; }
  .opt .shape { font-size:1.2em; }
  .opt .count { margin-left:auto; background:rgba(0,0,0,.25); border-radius:10px; padding:2px 12px; }
  .opt.dim { opacity:.25; }
  .opt.good { transform:scale(1.03); outline:5px solid #fff; }
  .c0{background:var(--c0)} .c1{background:var(--c1)} .c2{background:var(--c2)} .c3{background:var(--c3)}

  /* Scores */
  .board { display:flex; flex-direction:column; gap:12px; width:min(800px,92vw); align-self:center; }
  .row { display:flex; align-items:center; gap:16px; background:var(--card); border-radius:14px;
         padding:14px 22px; font-size:clamp(18px,2.4vw,32px); }
  .row .rk { width:2em; font-weight:800; color:var(--gold); }
  .row .nm { flex:1; }
  .row .pts { font-weight:800; }
  .row .plus { color:#7ee2a0; font-size:.7em; margin-left:10px; }
  .podium { display:flex; align-items:flex-end; justify-content:center; gap:3vw; }
  .step { background:var(--card); border-radius:14px 14px 0 0; width:min(22vw,220px); text-align:center;
          padding:16px 8px; font-size:clamp(18px,2.4vw,30px); font-weight:700; }
  .step .medal { font-size:2em; }
  .jarl { font-size:clamp(24px,4vw,54px); text-align:center; color:var(--gold); font-weight:800; }

  /* Player (phone) */
  .pgrid { display:grid; grid-template-columns:1fr 1fr; gap:12px; flex:1; }
  .pbtn { border:0; border-radius:18px; color:#fff; font-size:20px; font-weight:700; padding:16px 10px;
          display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
          min-height:30vh; cursor:pointer; }
  .pbtn .shape { font-size:44px; }
  .pbtn:active { transform:scale(.97); }
  input { font-size:22px; padding:14px 18px; border-radius:12px; border:0; width:100%; }
  .big { font-size:28px; font-weight:800; text-align:center; }
  .huge { font-size:72px; text-align:center; }
  .pill { align-self:center; background:var(--card); border-radius:999px; padding:8px 18px; }
</style>
</head>
<body>
<div id="app"></div>
<script>
(() => {
const COLORS = ['c0','c1','c2','c3'];
const SHAPES = ['▲','◆','●','■'];
const DURATION = 20; // secondes par question
const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
};
const params = new URLSearchParams(location.search);
const joinId = params.get('join');
if (joinId) player(joinId); else host();

/* ======================= ÉCRAN TÉLÉ ======================= */
function host() {
  const Q = window.QUESTIONS || [];
  const id = 'quiznoel-' + Math.random().toString(36).slice(2, 9);
  const joinUrl = location.origin + location.pathname + '?join=' + id;
  const players = new Map(); // nom -> joueur
  let phase = 'connecting', qi = -1, qStart = 0, timer = null, error = '';

  const peer = new Peer(id);
  peer.on('open', () => { phase = 'lobby'; render(); });
  peer.on('error', e => { error = 'Souci de connexion (' + e.type + '). Recharge la page.'; render(); });
  peer.on('disconnected', () => { try { peer.reconnect(); } catch(e){} });

  peer.on('connection', conn => {
    conn.on('data', msg => {
      if (!msg || typeof msg !== 'object') return;
      if (msg.type === 'hello') {
        const name = String(msg.name || '').trim().slice(0, 16) || 'Joueur';
        let p = players.get(name);
        if (!p) { p = { name, score: 0, answer: null, lastPoints: 0, lastCorrect: false }; players.set(name, p); }
        p.conn = conn; conn.playerName = name;
        sendState(p); render();
      } else if (msg.type === 'answer') {
        const p = players.get(conn.playerName);
        if (!p || phase !== 'question' || p.answer !== null) return;
        const c = Number(msg.choice);
        if (!(c >= 0 && c < Q[qi].options.length)) return;
        p.answer = { choice: c, ms: Date.now() - qStart };
        sendState(p); render();
        if (online().every(x => x.answer !== null)) reveal();
      }
    });
    conn.on('close', () => render());
  });

  const online = () => [...players.values()].filter(p => p.conn && p.conn.open);
  const ranked = () => [...players.values()].sort((a, b) => b.score - a.score);

  function sendState(p) {
    if (!p.conn || !p.conn.open) return;
    const r = ranked();
    const q = Q[qi];
    const msg = {
      type: 'state', phase, idx: qi, total: Q.length, name: p.name, score: p.score,
      rank: r.indexOf(p) + 1, nPlayers: r.length,
      answered: p.answer !== null, myChoice: p.answer ? p.answer.choice : null,
      lastCorrect: p.lastCorrect, lastPoints: p.lastPoints
    };
    if (q && (phase === 'question' || phase === 'reveal')) msg.options = q.options;
    if (q && phase === 'reveal') msg.correct = q.answer;
    try { p.conn.send(msg); } catch(e){}
  }
  const broadcast = () => players.forEach(sendState);

  function startQuestion(i) {
    qi = i; phase = 'question';
    players.forEach(p => { p.answer = null; });
    qStart = Date.now();
    clearInterval(timer);
    timer = setInterval(tick, 200);
    broadcast(); render();
  }
  function tick() {
    const left = Math.max(0, Math.ceil(DURATION - (Date.now() - qStart) / 1000));
    const el = document.getElementById('timer');
    if (el) el.textContent = left;
    if (left <= 0) reveal();
  }
  function reveal() {
    if (phase !== 'question') return;
    clearInterval(timer);
    const q = Q[qi];
    players.forEach(p => {
      if (p.answer && p.answer.choice === q.answer) {
        const speed = Math.max(0, 1 - p.answer.ms / (DURATION * 1000));
        p.lastPoints = Math.round(500 + 500 * speed);
        p.lastCorrect = true;
        p.score += p.lastPoints;
      } else { p.lastPoints = 0; p.lastCorrect = false; }
    });
    phase = 'reveal';
    broadcast(); render();
  }
  function next() {
    if (phase === 'lobby') startQuestion(0);
    else if (phase === 'question') reveal();
    else if (phase === 'reveal') { phase = 'scores'; broadcast(); render(); }
    else if (phase === 'scores') {
      if (qi + 1 < Q.length) startQuestion(qi + 1);
      else { phase = 'end'; broadcast(); render(); }
    } else if (phase === 'end') {
      players.forEach(p => { p.score = 0; p.lastPoints = 0; p.lastCorrect = false; p.answer = null; });
      qi = -1; phase = 'lobby'; broadcast(); render();
    }
  }
  document.addEventListener('keydown', e => {
    if ((e.key === ' ' || e.key === 'Enter') && phase !== 'connecting') { e.preventDefault(); next(); }
  });

  function qrSvg(text) {
    const qr = qrcode(0, 'M'); qr.addData(text); qr.make();
    return qr.createSvgTag({ cellSize: 6, margin: 2, scalable: true });
  }

  function render() {
    if (error) { app.innerHTML = `<div class="grow"><h1>😕</h1><p class="big">${esc(error)}</p></div>`; return; }
    const q = Q[qi];
    let html = '';
    if (phase === 'connecting') {
      html = `<div class="grow"><h1>🎄 Quiz de Noël</h1><p class="center muted">Connexion…</p></div>`;
    } else if (phase === 'lobby') {
      const chips = [...players.values()].map(p =>
        `<span class="chip">${p.conn && p.conn.open ? '🟢' : '⚪'} ${esc(p.name)}</span>`).join('')
        || '<span class="muted">En attente des joueurs…</span>';
      html = `<h1>🎄 Quiz de Noël</h1>
        <div class="grow"><div class="lobby">
          <div><div class="qr">${qrSvg(joinUrl)}</div><p class="url">${esc(joinUrl)}</p></div>
          <div style="display:flex;flex-direction:column;gap:20px">
            <p class="big">Scanne pour jouer 📱</p>
            <div class="chips">${chips}</div>
          </div>
        </div></div>
        <button class="btn" id="go" ${players.size ? '' : 'disabled'}>Lancer la partie</button>
        <p class="hint">Espace ou Entrée pour avancer</p>`;
    } else if (phase === 'question' || phase === 'reveal') {
      const counts = q.options.map((_, i) => [...players.values()].filter(p => p.answer && p.answer.choice === i).length);
      const answered = [...players.values()].filter(p => p.answer !== null).length;
      const left = Math.max(0, Math.ceil(DURATION - (Date.now() - qStart) / 1000));
      const opts = q.options.map((o, i) => {
        const cls = phase === 'reveal' ? (i === q.answer ? 'good' : 'dim') : '';
        const cnt = phase === 'reveal' ? `<span class="count">${counts[i]}</span>` : '';
        return `<div class="opt ${COLORS[i]} ${cls}"><span class="shape">${SHAPES[i]}</span>${esc(o)}${cnt}</div>`;
      }).join('');
      html = `<div class="top"><span>Question ${qi + 1} / ${Q.length}</span>
          ${phase === 'question' ? `<div class="timer" id="timer">${left}</div>` : '<span class="big">✅</span>'}
          <span>${answered} / ${online().length} réponses</span></div>
        <div class="grow"><p class="qtext">${esc(q.text)}</p><div class="opts">${opts}</div></div>
        <button class="btn" id="go">${phase === 'question' ? 'Révéler la réponse' : 'Classement'}</button>`;
    } else if (phase === 'scores') {
      const rows = ranked().slice(0, 8).map((p, i) =>
        `<div class="row"><span class="rk">${i + 1}</span><span class="nm">${esc(p.name)}</span>
         <span class="pts">${p.score}${p.lastPoints ? `<span class="plus">+${p.lastPoints}</span>` : ''}</span></div>`).join('');
      html = `<h1>🏆 Classement</h1><div class="grow"><div class="board">${rows}</div></div>
        <button class="btn" id="go">${qi + 1 < Q.length ? 'Question suivante' : 'Résultats finaux'}</button>`;
    } else if (phase === 'end') {
      const r = ranked();
      const order = [1, 0, 2].filter(i => r[i]);
      const heights = { 0: '32vh', 1: '24vh', 2: '18vh' };
      const medals = ['🥇', '🥈', '🥉'];
      const steps = order.map(i =>
        `<div class="step" style="height:${heights[i]}"><div class="medal">${medals[i]}</div>${esc(r[i].name)}<div class="muted">${r[i].score}</div></div>`).join('');
      html = `<h1>🎉 Fin de la partie !</h1>
        <div class="grow">${r[0] ? `<p class="jarl">👑 ${esc(r[0].name)}, Jarl de Noël</p>` : ''}<div class="podium">${steps}</div></div>
        <button class="btn" id="go">Rejouer</button>`;
    }
    app.innerHTML = html;
    const go = document.getElementById('go');
    if (go) go.onclick = next;
  }
  render();
}

/* ======================= MANETTE TÉLÉPHONE ======================= */
function player(hostId) {
  let conn = null, state = null, name = store.get('quiznoel-name') || '', status = 'form';

  function connect() {
    status = 'connecting'; render();
    const peer = new Peer();
    peer.on('open', () => {
      conn = peer.connect(hostId, { reliable: true });
      conn.on('open', () => { status = 'in'; conn.send({ type: 'hello', name }); render(); });
      conn.on('data', msg => { if (msg && msg.type === 'state') { state = msg; render(); } });
      conn.on('close', () => { status = 'lost'; render(); });
      conn.on('error', () => { status = 'lost'; render(); });
    });
    peer.on('error', () => { status = 'lost'; render(); });
    setTimeout(() => { if (status === 'connecting') { status = 'lost'; render(); } }, 15000);
  }

  function render() {
    let html = '';
    if (status === 'form') {
      html = `<div class="grow"><h1>🎄 Quiz de Noël</h1>
        <input id="nm" maxlength="16" placeholder="Ton prénom" value="${esc(name)}" autocomplete="off">
        <button class="btn" id="join">Rejoindre</button></div>`;
    } else if (status === 'connecting') {
      html = `<div class="grow"><p class="huge">⏳</p><p class="big">Connexion…</p></div>`;
    } else if (status === 'lost') {
      html = `<div class="grow"><p class="huge">📡</p><p class="big">Connexion perdue</p>
        <p class="center muted">Vérifie que l'écran télé est toujours ouvert.</p>
        <button class="btn" id="retry">Se reconnecter</button></div>`;
    } else if (!state || state.phase === 'lobby') {
      html = `<div class="grow"><p class="huge">✅</p><p class="big">C'est bon, ${esc(name)} !</p>
        <p class="center muted">Regarde la télé, ça va commencer.</p></div>`;
    } else if (state.phase === 'question' && !state.answered) {
      const btns = state.options.map((o, i) =>
        `<button class="pbtn ${COLORS[i]}" data-c="${i}"><span class="shape">${SHAPES[i]}</span>${esc(o)}</button>`).join('');
      html = `<p class="pill">Question ${state.idx + 1} / ${state.total}</p><div class="pgrid">${btns}</div>`;
    } else if (state.phase === 'question') {
      const c = state.myChoice;
      html = `<div class="grow"><p class="huge">${SHAPES[c]}</p><p class="big">Réponse envoyée !</p>
        <p class="center muted">On attend les autres…</p></div>`;
    } else if (state.phase === 'reveal') {
      html = state.lastCorrect
        ? `<div class="grow"><p class="huge">🎉</p><p class="big">Bonne réponse !</p><p class="big" style="color:#7ee2a0">+${state.lastPoints}</p></div>`
        : `<div class="grow"><p class="huge">${state.myChoice === null ? '⌛' : '❌'}</p>
           <p class="big">${state.myChoice === null ? 'Trop tard !' : 'Raté !'}</p>
           <p class="center muted">C'était : ${esc(state.options[state.correct])}</p></div>`;
    } else if (state.phase === 'scores') {
      html = `<div class="grow"><p class="huge">🏆</p><p class="big">${state.rank}${state.rank === 1 ? 'er' : 'e'} sur ${state.nPlayers}</p>
        <p class="center">${state.score} points</p></div>`;
    } else if (state.phase === 'end') {
      html = `<div class="grow"><p class="huge">${state.rank === 1 ? '👑' : state.rank <= 3 ? '🏅' : '🎄'}</p>
        <p class="big">${state.rank === 1 ? 'Jarl de Noël !' : `${state.rank}e place`}</p>
        <p class="center">${state.score} points</p></div>`;
    }
    app.innerHTML = html;
    const join = document.getElementById('join');
    if (join) {
      const input = document.getElementById('nm');
      const go = () => { name = input.value.trim().slice(0, 16); if (!name) return input.focus(); store.set('quiznoel-name', name); connect(); };
      join.onclick = go;
      input.onkeydown = e => { if (e.key === 'Enter') go(); };
    }
    const retry = document.getElementById('retry');
    if (retry) retry.onclick = connect;
    app.querySelectorAll('.pbtn').forEach(b => b.onclick = () => {
      if (!conn || !conn.open) return;
      const c = Number(b.dataset.c);
      conn.send({ type: 'answer', choice: c });
      state = Object.assign({}, state, { answered: true, myChoice: c });
      if (navigator.vibrate) navigator.vibrate(40);
      render();
    });
  }
  render();
}
})();
</script>
</body>
</html>
